[project]
name = "ttc"
version = "1.0.0"
description = "TTC — Efficient Test-time Adaptation through Candidate Verification and Divergence Shifts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Seungmin Oh" }, { name = "Seunghun Kang" }, { name = "Jongbin Ryu" }]

dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy",
    "packaging",
    "safetensors",
    "numba",
    "scipy",
    "ftfy",
    "regex",
    "pillow>=9.0",
    "pandas",
    "pyyaml",
    "tqdm",
    "rich",
    "termcolor",
]

[project.urls]
Repository = "https://github.com/mmai-laboratory/ttc"

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["dev"]
python-preference = "managed"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttc"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/ttc/clip/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
